name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android-native: ${{ steps.select.outputs.android-native }}
      ios-native: ${{ steps.select.outputs.ios-native }}
      macos-native: ${{ steps.select.outputs.macos-native }}
      linux-native: ${{ steps.select.outputs.linux-native }}
      windows-native: ${{ steps.select.outputs.windows-native }}
      macos-generation: ${{ steps.select.outputs.macos-generation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test CI selection and SDK bootstrap
        run: python3 -m unittest discover -s test/tool/ci -p '*_test.py'
      - name: Select jobs from the merge-base diff
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tool/ci/ci_jobs.py

  quality:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [source, test, web-and-example, package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      - name: Run ${{ matrix.check }} checks
        env:
          CHECK: ${{ matrix.check }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fvm flutter pub upgrade --no-example
          (
            cd example
            fvm flutter pub get --enforce-lockfile
          )

          case "$CHECK" in
            source)
              fvm dart run tool/generate_country_names.dart --check
              ./tool/check_device_location_pigeon.sh
              ./tool/check_device_display_pigeon.sh
              ./tool/check_native_selectable_text_pigeon.sh
              fvm dart format --output none --set-exit-if-changed hook lib pigeons test tool example/lib example/test example/integration_test example/benchmark
              fvm flutter analyze --fatal-infos --no-pub
              fvm dart doc --validate-links
              (
                cd tool/country_bindings
                fvm dart pub get --enforce-lockfile
                fvm dart analyze --fatal-infos
                fvm dart test
              )
              (
                cd tool/device_location_bindings
                fvm dart pub get --enforce-lockfile
                fvm dart analyze --fatal-infos
                fvm dart test
              )
              ;;
            test)
              fvm flutter test --no-pub
              ;;
            web-and-example)
              fvm flutter test \
                --no-pub \
                --platform chrome \
                test/country/country_names_browser_test.dart \
                test/device/device_test.dart \
                test/device/device_display/device_display_unsupported_test.dart \
                test/device/device_location/device_location_test.dart \
                test/device/device_location/device_location_unsupported_test.dart \
                test/device/device_location/device_location_coordinates_test.dart \
                test/exceptions/device_location_exception_test.dart \
                test/exceptions/device_location_exception_reason_test.dart \
                test/widgets/morph_flight_test.dart \
                test/widgets/morph_text_test.dart \
                test/widgets/morph_container_test.dart \
                test/widgets/morph_column_test.dart \
                test/widgets/native_selectable_text_web_test.dart
              (
                cd example
                fvm flutter pub get --enforce-lockfile
                fvm flutter analyze --fatal-infos --no-pub
                fvm flutter test --no-pub
              )
              ;;
            package)
              fvm flutter pub publish --dry-run
              fvm dart pub global activate pana
              fvm dart pub global run pana .
              ;;
            *)
              echo "Unknown quality check: $CHECK" >&2
              exit 1
              ;;
          esac

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      - name: Test minimum dependencies
        run: |
          fvm flutter pub downgrade --no-example
          (
            cd example
            fvm flutter pub get --enforce-lockfile
          )
          fvm flutter analyze --fatal-infos --no-pub
          fvm flutter test --no-pub

  android-native:
    needs: changes
    if: needs.changes.outputs.android-native == 'true'
    name: Android native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - run: fvm flutter pub get --enforce-lockfile
        working-directory: example
      - run: fvm flutter build apk --release
        working-directory: example
      - run: ./gradlew :oh_my_flutter:testDebugUnitTest :oh_my_flutter:lintDebug
        working-directory: example/android
      - name: Check Android country bindings
        run: ./tool/generate_country_bindings.sh android --check

  ios-native:
    needs: changes
    if: needs.changes.outputs.ios-native == 'true'
    name: iOS (${{ matrix.check }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [integration, validation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      - name: Run iOS ${{ matrix.check }} checks
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            integration)
              ./tool/check_device_location_ios_integration.sh

              device_line="$(xcrun simctl list devices available | grep 'iPhone.*(Booted)' | head -n 1 || true)"
              if test -z "$device_line"; then
                device_line="$(xcrun simctl list devices available | grep 'iPhone.*(Shutdown)' | tail -n 1)"
              fi
              device_id="$(sed -E 's/.*\(([0-9A-F-]{36})\) \((Booted|Shutdown)\).*/\1/' <<<"$device_line")"
              if ! [[ "$device_id" =~ ^[0-9A-F-]{36}$ ]]; then
                echo 'No available iPhone simulator was found.' >&2
                exit 1
              fi
              flutter_framework_directory="$PWD/example/build/ios/Debug-iphonesimulator"
              ./tool/ci/time_command.sh "iOS native XCTest" xcodebuild test \
                -quiet \
                -workspace example/ios/Runner.xcworkspace \
                -scheme oh_my_flutterTests \
                -destination "platform=iOS Simulator,id=$device_id" \
                CODE_SIGNING_ALLOWED=NO \
                FRAMEWORK_SEARCH_PATHS="$flutter_framework_directory" \
                LD_RUNPATH_SEARCH_PATHS="$flutter_framework_directory"
              ;;
            validation)
              ./tool/check_device_location_ios.sh
              ;;
            *)
              echo "Unknown iOS check: $CHECK" >&2
              exit 1
              ;;
          esac

  macos-native:
    needs: changes
    if: needs.changes.outputs.macos-native == 'true'
    name: macOS native and platform tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      # These tests use the host SDK; simulated widget platforms run on Linux.
      - name: Test macOS platform behavior
        run: |
          fvm flutter pub upgrade --no-example
          fvm flutter test --no-pub \
            test/country/country_test.dart \
            test/country/country_names_io_test.dart \
            test/country/country_names_apple_test.dart \
            test/device/device_location/apple_device_location_platform_test.dart
      - run: fvm flutter pub get --enforce-lockfile
        working-directory: example
      - run: fvm flutter build macos --debug --target=lib/main.dart --no-pub
        working-directory: example
      - name: Test NativeSelectableText on macOS
        run: |
          flutter_framework_directory="$PWD/example/build/macos/Build/Products/Debug"
          xcodebuild test \
            -quiet \
            -workspace example/macos/Runner.xcworkspace \
            -scheme oh_my_flutterTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS="$flutter_framework_directory" \
            LD_RUNPATH_SEARCH_PATHS="$flutter_framework_directory"

  linux-native:
    needs: changes
    if: needs.changes.outputs.linux-native == 'true'
    name: Linux native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      - name: Install Linux desktop headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-3-dev
      - run: fvm flutter pub get --enforce-lockfile
        working-directory: example
      - run: fvm flutter build linux --debug --target=lib/main.dart --no-pub
        working-directory: example
      - run: cmake --build example/build/linux/x64/debug --target oh_my_flutter_test
      - run: xvfb-run --auto-servernum ctest --test-dir example/build/linux/x64/debug/plugins/oh_my_flutter --output-on-failure

  windows-native:
    needs: changes
    if: needs.changes.outputs.windows-native == 'true'
    name: Windows native and platform tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      # These tests load Windows ICU; simulated widget platforms run on Linux.
      - name: Test Windows platform behavior
        run: |
          fvm flutter pub upgrade --no-example
          fvm flutter test --no-pub test/country/country_test.dart test/country/country_names_io_test.dart test/country/country_names_windows_test.dart
      - run: fvm flutter pub get --enforce-lockfile
        working-directory: example
      - run: fvm flutter build windows --debug --target=lib/main.dart --no-pub
        working-directory: example
      - run: cmake --build example/build/windows/x64 --config Debug --target oh_my_flutter_test
      - run: ctest --test-dir example/build/windows/x64/plugins/oh_my_flutter -C Debug --output-on-failure

  macos-generation:
    name: Apple and Windows binding generation
    needs: changes
    if: needs.changes.outputs.macos-generation == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Set up FVM
        run: ./tool/setup_ci_fvm.sh
        shell: bash
      - name: Check generated bindings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fvm flutter pub upgrade --no-example
          ./tool/generate_country_bindings.sh apple --check
          ./tool/generate_country_bindings.sh windows --check
          ./tool/generate_device_location_bindings.sh --check

  required:
    name: Required
    if: always()
    needs: [changes, quality, minimum-dependencies, android-native, ios-native, macos-native, linux-native, windows-native, macos-generation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected CI job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tool/ci/ci_jobs.py required
