name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          required_check_count="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Required" and .conclusion == "success")] | length'
          )"
          test "$required_check_count" -gt 0
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: dart pub global activate fvm
      - run: fvm install
      - run: fvm flutter pub upgrade
      - run: fvm flutter pub get --enforce-lockfile
        working-directory: example
      - run: ./tool/check_device_location_pigeon.sh
      - run: ./tool/check_device_display_pigeon.sh
      - run: ./tool/device_display_model/validate_device_display_model.sh
      - run: fvm dart run tool/device_display_model/device_display_model.dart check-collectors
      - run: fvm flutter pub publish --dry-run
      - run: ./tool/device_display_model/check_device_display_publish_archive.sh
      - run: fvm flutter pub publish --force
