version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dart-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
